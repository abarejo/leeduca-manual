<!-- Selector de idioma (27/11/2026): dos banderas discretas arriba a la derecha.
     Lleva a la misma página en el otro idioma si existe; si no, a la portada de ese idioma. -->
<div id="lx-idioma" aria-label="Idioma / Language">
  <a href="#" data-lang="es" title="Versión en español" aria-label="Versión en español">
    <svg viewBox="0 0 30 20" width="24" height="16" aria-hidden="true"><rect width="30" height="20" fill="#AA151B"/><rect y="5" width="30" height="10" fill="#F1BF00"/></svg>
  </a>
  <a href="#" data-lang="en" title="English version" aria-label="English version">
    <svg viewBox="0 0 60 30" width="24" height="16" aria-hidden="true" preserveAspectRatio="none"><clipPath id="lx-uk"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#lx-uk)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>
  </a>
</div>
<style>
#lx-idioma{position:fixed;top:.6rem;right:.8rem;z-index:1050;display:flex;gap:.35rem;padding:.25rem .35rem;border-radius:6px;background:rgba(255,255,255,.85);box-shadow:0 1px 3px rgba(0,0,0,.12)}
#lx-idioma a{display:block;line-height:0;border-radius:2px;opacity:.45;transition:opacity .15s}
#lx-idioma a:hover,#lx-idioma a:focus{opacity:1}
#lx-idioma a.lx-actual{opacity:1;outline:2px solid #2689B7;outline-offset:1px;pointer-events:none}
#lx-idioma svg{display:block;border-radius:2px}
@media (max-width: 991.98px){#lx-idioma{top:auto;bottom:.8rem}}
@media (prefers-color-scheme: dark){#lx-idioma{background:rgba(40,40,40,.85)}}
</style>
<script>
(function(){
  var box = document.getElementById('lx-idioma'); if (!box) return;
  var lang = (document.documentElement.lang || 'es').slice(0, 2);
  var meta = document.querySelector('meta[name="quarto:offset"]');
  var raiz = new URL(meta ? meta.content : './', location.href);       // raíz del libro de esta página
  var rel = decodeURIComponent(location.pathname.slice(raiz.pathname.length)) || 'index.html';
  var es, en;
  if (lang === 'en') {                                                // libro inglés: vive en <sitio>/en/
    en = location.href;
    es = new URL('../' + (rel.replace(/\.en\.html$/, '.html') || 'index.html'), raiz).href;
    var portadaEs = new URL('../', raiz).href, portadaEn = raiz.href;
  } else {
    es = location.href;
    en = new URL('en/' + (/^summary-en\.html$/.test(rel) ? rel : rel.replace(/\.html$/, '.en.html')), raiz).href;
    var portadaEs = raiz.href, portadaEn = new URL('en/', raiz).href;
  }
  box.querySelectorAll('a').forEach(function(a){
    var l = a.getAttribute('data-lang');
    if (l === lang) { a.classList.add('lx-actual'); a.setAttribute('aria-current', 'true'); return; }
    var destino = l === 'en' ? en : es, portada = l === 'en' ? portadaEn : portadaEs;
    a.href = destino;
    a.addEventListener('click', function(ev){
      ev.preventDefault();
      fetch(destino, {method: 'HEAD'}).then(function(r){ location.href = r.ok ? destino : portada; })
                                      .catch(function(){ location.href = destino; });
    });
  });
})();
</script>
