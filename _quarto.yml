project:
  type: book
  resources:
    - /apps/
    - /datos/agregados/CATALOGO/
    - /figuras/pantallas/


profile:
  default: es

# Configuración común a las dos versiones del libro.
# La versión en español está en _quarto-es.yml y la inglesa en _quarto-en.yml.
# Generar: `quarto render` (español, en _book/) y `quarto render --profile en` (inglés, en _book/en/).

book:
  repo-url: https://github.com/abarejo/leeduca-manual
  repo-actions: [edit, issue, source]
  search: true
  page-navigation: true

bibliography: referencias.bib

format:
  html:
    theme:
      light: [cosmo, estilo.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    fig-align: center
    code-tools: false
    df-print: kable
    lightbox: true
    # borrador: que los buscadores no indexen la web (quitar al publicar la versión 1.0)
    include-in-header:
      text: '<meta name="robots" content="noindex, nofollow">'
    # selector de idioma con banderas (27/11/2026)
    include-after-body: _includes/idioma.html

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
