project:
  type: book
  resources:
    - apps/
    - datos/agregados/CATALOGO/
    - figuras/pantallas/
  output-dir: _book

lang: es

book:
  title: "Manual técnico de la plataforma LEEDUCA"
  subtitle: "Evaluación y seguimiento del aprendizaje de la lectoescritura de 4 a 11 años"
  author: "Grupo de investigación LEEDUCA · Universidad de Málaga"
  date: today
  date-format: "D [de] MMMM [de] YYYY"
  repo-url: https://github.com/abarejo/leeduca-manual
  repo-actions: [edit, issue, source]
  search: true
  page-navigation: true
  sidebar:
    tools:
      - icon: chat-left-text
        href: https://docs.google.com/forms/d/e/1FAIpQLScH_9p-H91zfa-F4q6KJ_XS-Dr7MT2Yu84wsa4ZT97JvnHFww/viewform
        text: "Enviar una sugerencia"
  chapters:
    - index.qmd
    - part: "Cómo está hecho el manual"
      chapters:
        - estructura.qmd
        - definicion.qmd
        - metodo.qmd
        - decisiones.qmd
        - agrupacion.qmd
        - limites.qmd
        - riesgo.qmd
        - baremos-trimestre.qmd
    - part: "Catálogo de tareas"
      chapters:
        - catalogo.qmd
    - part: "Fichas piloto"
      chapters:
        - fichas/LET.qmd
        - fichas/VEL.qmd
        - fichas/RAN.qmd
        - fichas/CF523.qmd
        - fichas/TECLE.qmd
    - part: "Fichas automáticas"
      chapters:
        - fichas/auto/index.qmd
    - part: "Fichas A · Precisión"
      chapters:
        - fichas/auto/CF_CONTAR_SILABAS.qmd
        - fichas/auto/CF_IDENTIFICACION_FONEMA_FINAL.qmd
        - fichas/auto/CF_IDENTIFICACION_FONEMA_INICIAL.qmd
        - fichas/auto/CF_SEGMENTACION_FONEMICA.qmd
        - fichas/auto/CF_SUPRESION_FONEMAS_TP.qmd
        - fichas/auto/CF_SUPRESION_SILABA_INICIAL.qmd
        - fichas/auto/CF_SUPRESION_SILABA_JA_TODAS_POSIC.qmd
        - fichas/auto/CF_SUPRESION_SILABAS_TP.qmd
        - fichas/auto/CF_SUPRESION_FONEMA_FINAL.qmd
        - fichas/auto/CF_SUPRESION_FONEMA_INICIAL.qmd
        - fichas/auto/LECTURA_RF_ESCRIBIR_LETRA_INICIAL.qmd
        - fichas/auto/L_ORAL_SEM_VOCABULARIO_DEFINICIONES.qmd
        - fichas/auto/MATE_CONTAR_H_ATRAS_1O_DECENA.qmd
        - fichas/auto/MATE_CONTAR_H_ATRAS_2A_DECENA.qmd
        - fichas/auto/MATE_CONTAR_H_DELANTE_2A_DECENA.qmd
        - fichas/auto/MATE_ET_VERB_ARABIGOS.qmd
    - part: "Fichas C · Fluidez lectora oral"
      chapters:
        - fichas/auto/LEC_LETRAS.qmd
        - fichas/auto/LEC_LECT_COMPRENSIVA.qmd
        - fichas/auto/LEC_PAL_2sil.qmd
        - fichas/auto/LEC_PAL_4sil.qmd
        - fichas/auto/LEC_PAL_1sil.qmd
        - fichas/auto/LEC_PAL_3sil.qmd
        - fichas/auto/LEC_PSEUDO_2sil.qmd
        - fichas/auto/LEC_PSEUDO_4sil.qmd
        - fichas/auto/LEC_PSEUDO_3sil.qmd
        - fichas/auto/LEC_SILABAS_COMPLEJA.qmd
        - fichas/auto/LEC_SILABAS_SIMPLE.qmd
        - fichas/auto/LEC_VEL_TEXTO.qmd
    - part: "Fichas D · Eficiencia con tiempo limitado"
      chapters:
        - fichas/auto/LECTURA_DECODIFIC_VOCABULARIO.qmd
    - part: "Fichas E · Decisión con tiempo de respuesta"
      chapters:
        - fichas/auto/LEC_DECISION_ORTOGRAFICA.qmd
        - fichas/auto/F_EJEC_INH_INHIBICION.qmd
    - part: "Fichas F · Amplitud y memoria"
      chapters:
        - fichas/auto/F_EJEC_MEM_OP_MEMORIA_CONCEPTOS.qmd
    - part: "Preleo"
      chapters:
        - preleo/programa.qmd
        - preleo/datos.qmd
  appendices:
    - informe-aula.qmd
    - agenda.qmd
    - consultas.qmd
    - novedades.qmd
    - colaborar.qmd
    - referencias.qmd

bibliography: referencias.bib

format:
  html:
    theme:
      light: [cosmo, estilo.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    fig-align: center
    code-tools: false
    df-print: kable
    lightbox: true
    # borrador: que los buscadores no indexen la web (quitar al publicar la versión 1.0)
    include-in-header:
      text: '<meta name="robots" content="noindex, nofollow">'

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
