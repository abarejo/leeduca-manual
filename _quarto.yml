project:
  type: book
  resources:
    - apps/
  output-dir: _book

lang: es

book:
  title: "Manual técnico de la plataforma LEEDUCA"
  subtitle: "Evaluación y seguimiento del aprendizaje de la lectoescritura de 4 a 11 años"
  author: "Grupo de investigación LEEDUCA · Universidad de Málaga"
  date: today
  date-format: "D [de] MMMM [de] YYYY"
  repo-url: https://github.com/abarejo/leeduca-manual
  repo-actions: [edit, issue, source]
  search: true
  page-navigation: true
  sidebar:
    tools:
      - icon: chat-left-text
        href: https://docs.google.com/forms/d/e/1FAIpQLScH_9p-H91zfa-F4q6KJ_XS-Dr7MT2Yu84wsa4ZT97JvnHFww/viewform
        text: "Enviar una sugerencia"
  chapters:
    - index.qmd
    - part: "Cómo está hecho el manual"
      chapters:
        - metodo.qmd
        - decisiones.qmd
        - baremos-trimestre.qmd
    - part: "Fichas piloto"
      chapters:
        - fichas/LET.qmd
        - fichas/VEL.qmd
        - fichas/RAN.qmd
    - part: "Preleo"
      chapters:
        - preleo/programa.qmd
        - preleo/datos.qmd
  appendices:
    - informe-aula.qmd
    - consultas.qmd
    - novedades.qmd
    - colaborar.qmd
    - referencias.qmd

bibliography: referencias.bib

format:
  html:
    theme:
      light: [cosmo, estilo.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    fig-align: center
    code-tools: false
    df-print: kable
    lightbox: true
    # borrador: que los buscadores no indexen la web (quitar al publicar la versión 1.0)
    include-in-header:
      text: '<meta name="robots" content="noindex, nofollow">'

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
