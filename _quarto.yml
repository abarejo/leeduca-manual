bibliography: referencias.bib

format:
  html:
    theme:
      light: [cosmo, estilo.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    fig-align: center
    code-tools: false
    df-print: kable
    lightbox: true
    # borrador: que los buscadores no indexen la web (quitar al publicar la versión 1.0)
    include-in-header:
      text: '<meta name="robots" content="noindex, nofollow">'

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
